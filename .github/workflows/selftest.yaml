name: Self-test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        id: get_actionlint
        shell: bash
        run: bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      # actionlint bundles shellcheck for inline `run:` scripts. Pin its
      # severity to error to match the standalone shellcheck job's
      # threshold — info-level findings (SC2035, SC2086 on basename
      # globs) are tracked separately and would otherwise drown out
      # real regressions.
      - name: Lint workflows under .github/workflows/
        shell: bash
        run: ${{ steps.get_actionlint.outputs.executable }} -color -shellcheck "shellcheck -S error"

      - name: Lint reference workflow templates under .github/actions/
        shell: bash
        run: ${{ steps.get_actionlint.outputs.executable }} -color -shellcheck "shellcheck -S error" .github/actions/*.yaml

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # severity=error keeps the signal-to-noise high. The known quoting
      # patterns in entrypoint.sh / local.sh are tracked under E9 and would
      # only flag at warning level.
      - uses: ludeeus/action-shellcheck@master
        with:
          additional_files: 'entrypoint.sh local.sh'
          severity: error
          ignore_paths: '.git'
