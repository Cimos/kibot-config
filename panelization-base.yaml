kibot:
  version: 1

outputs:
  - name: build_pcb_panel
    comment: "Create PCB Panel"
    type: panelize
    dir: Panel
    options:
      title: '%f-%r'
      units: mm
      create_preview: True
      configs:
        - layout:
            space: @LAYOUT_SPACE@
            hbackbone: @LAYOUT_H_BACKBONE@
            vbackbone: @LAYOUT_V_BACKBONE@
            rows: @LAYOUT_ROWS@
            cols: @LAYOUT_COLS@
            rotation: @LAYOUT_ROTATION@
            vbonecut: False
            hbonecut: False
          # page:
          #   size: A0
          source:
            tolerance: 15
          tabs:
            type: annotation
            tabfootprints: @TABS_FOOTPRINT@
          cuts:
            type: vcuts
            offset: 0
            layer: 'User.2'
            clearance: 0.5
            cutcurves: False
          framing:
            type: frame
            width: @FRAME_WIDTH@
            space: @FRAME_SPACE@
            cuts: none
          copperfill:
            type: hatched
            clearance: 0.5
            width: 0.5
            spacing: 2
          tooling:
            type: 3hole
            hoffset: 5
            voffset: 5
          fiducials:
            type: 3fid
            hoffset: 5
            voffset: 2.5
            coppersize: 2
            opening: 1
          text:
            text: "{boardTitle}-{boardRevision}"
            anchor: mt
            voffset: 5
            hjustify: center
            vjustify: center
          post:
            millradius: 0.5
            origin: bl
            dimensions: True
          debug:
            trace: True
            drawPartitionLines : True
            drawboxes : True
            drawtabfail : True
            deterministic : True


# Default definitions
...
definitions:

  LAYOUT_SPACE: 1
  LAYOUT_H_BACKBONE: 3
  LAYOUT_V_BACKBONE: 3

  LAYOUT_ROWS: 3
  LAYOUT_COLS: 3
  LAYOUT_ROTATION: 0deg

  TABS_FOOTPRINT: kikit:Tab

  FRAME_WIDTH: 9
  FRAME_SPACE: 1