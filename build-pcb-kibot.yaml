kibot:
  version: 1

preflight:
  update_xml: true

import:
  # Add custom options for each repository
  - file: ../options.yaml
  - file: Elecrow
    definitions:
      _KIBOT_F_PASTE: '- F.Paste'
      _KIBOT_B_PASTE: '- B.Paste'
  - file: FusionPCB
    definitions:
      _KIBOT_F_PASTE: '- F.Paste'
      _KIBOT_B_PASTE: '- B.Paste'
  - file: JLCPCB
    definitions:
      _KIBOT_F_PASTE: '- F.Paste'
      _KIBOT_B_PASTE: '- B.Paste'
  - file: P-Ban
    definitions:
      _KIBOT_F_PASTE: '- F.Paste'
      _KIBOT_B_PASTE: '- B.Paste'
  - file: PCBWay
    definitions:
      _KIBOT_F_PASTE: '- F.Paste'
      _KIBOT_B_PASTE: '- B.Paste'

outputs:
# PDF Schematic
  - name: 'print_sch'
    comment: "Print schematic (PDF)"
    type: pdf_sch_print
    dir: Drawings
    options:
      output: '%f-%r-%i.%x'

# PDF Drawings
  - name: 'pcb_pdf'
    comment: "Print PCB Drawings (PDF)"
    type: pcb_print
    dir: Drawings
    options:
      frame_plot_mechanism: 'plot'
      dnf_filter: '_kibom_dnf'
      output: '%f-%r-drawing.pdf'
      pages:
        - layers:
          - layer: F.Fab
          - layer: Edge.Cuts
          - layer: Dwgs.User
          page_id: Front Assembly
        - layers:
          - layer: B.Fab
          - layer: Edge.Cuts
          - layer: Dwgs.User
          page_id: Back Assembly
        - layers:
          - layer: F.Cu
          - layer: Edge.Cuts
          page_id: Front Cu
        - layers:
          - layer: B.Cu
          - layer: Edge.Cuts
          page_id: Back Cu

# Generate Pick and Place files
  - name: 'position (ASCII)'
    comment: "Pick and place file"
    type: position
    dir: Position
    options:
      format: ASCII   # CSV or ASCII format
      units: millimeters  # millimeters or inches
      separate_files_for_front_and_back: true
      only_smd: true
      output: '%f-%r-%i.%x'

  - name: 'position (CSV)'
    comment: "Pick and place file"
    type: position
    dir: Position
    options:
      format: CSV   # CSV or ASCII format
      units: millimeters  # millimeters or inches
      separate_files_for_front_and_back: true
      only_smd: true
      output: '%f-%r-%i.%x'

  - name: 'report_full'
    comment: "Full design report"
    type: report
    dir: Design_Report

  - name: 'stencil_3d'
    comment: "Creates a 3D printable stencil"
    type: stencil_3d
    dir: stencil/3D
    options:
      thickness: 20

  - name: 'stencil_for_jig'
    comment: "Creates a steel stencil and 3D register"
    type: stencil_for_jig
    dir: stencil/Jig
    options:
      thickness: 20

  # - name: KiKit_present_files
  #   comment: "Present test using full auto mode"
  #   type: kikit_present
  #   dir: Present/Auto
  #   options:
  #     repository: 'https://github.com/INTI-CMNB/KiBot/'

# Generate IBOM
  - name: 'interactive_bom'
    comment: "Interactive Bill of Materials (HTML)"
    type: ibom
    dir: BoM
    options:
      dark_mode: true
      dnf_filter: '_kibom_dnf'
      highlight_pin1: true
      include_tracks: true
      normalize_field_case: true
      name_format: '%f_%r_iBoM'
      group_fields: 'Value'
      show_fields: 'Value,MPN,Datasheet'
      output: '%f-%r-%i.%x'

# Generate csv/html BOM
  - name: 'bom_html'
    comment: "Bill of Materials in HTML format"
    type: kibom
    dir: BoM
    options:
      format: HTML
      output: '%f-%r-%i.%x'

  - name: 'bom_csv'
    comment: "Bill of Materials in CSV format"
    type: kibom
    dir: BoM
    options:
      format: CSV
      output: '%f-%r-%i.%x'
      conf:
        columns:
          - References
          - Value
          - Rating
          - Manufacturer
          - MPN
          - Supplier
          - Supplier PN
          - Quantity Per PCB
          - Price
      csv:
        hide_pcb_info: true
        hide_stats_info: true
        quote_all: true

  - name: 'KiCost'
    comment: "Components costs spreadsheet"
    type: kicost
    dir: KiCost_kicost
    options:
      output: 'simple'


  - name: 'bom_internal'
    comment: "Bill of Materials in HTML format"
    type: bom
    dir: KiCost_bom
    options:
      html:
        digikey_link: 'Supplier PN#'
        mouser_link: 'mouser#'
        lcsc_link: true
      output: '%f.%x'
      columns:
        - References
        - Part
        - Value
        - Quantity Per PCB
        - digikey#
        - digikey_alt#
        - mouser#
        - mouser_alt#
        - LCSC#
        - manf#
