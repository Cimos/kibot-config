kibot:
  version: 1

outputs:
# Kiri Diff
  - name: 'kiri'
    comment: "Test for KiRi interface"
    type: kiri
    layers:
    - all
    options:
      color_theme: _builtin_classic
      keep_generated: true
      background_color: "#E0E0E0"
      branch: 3b3741c
      zones: unfill
      max_commits: 10

# KiCAD Diff
  - name: 'diff_pcb'
    comment: "PCB difference with git HEAD"
    type: diff
    options:
      old: KIBOT_LAST-10
      old_type: git
      new: HEAD
      new_type: git
      cache_dir: .cache
      force_checkout: true
      add_link_id: true
      only_different: true


# KiCAD Diff
  - name: 'diff_sch'
    comment: "SCH difference with git HEAD"
    type: diff
    options:
      old: KIBOT_LAST-10
      old_type: git
      new: HEAD
      new_type: git
      cache_dir: .cache
      force_checkout: true
      add_link_id: true
      only_different: true
      pcb: false


