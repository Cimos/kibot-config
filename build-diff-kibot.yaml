kibot:
  version: 1

outputs:
# Kiri Diff
  - name: 'kiri'
    comment: "Test for KiRi interface"
    type: kiri
    dir: KIRI
    options:
      keep_generated: true
      max_commits: 10

# KiCAD Diff PCB
  - name: 'diff_pcb'
    comment: "PCB difference with git HEAD"
    dir: DIFF
    type: diff
    options:
      old: KIBOT_LAST-10
      old_type: git
      new: HEAD
      new_type: git
      cache_dir: .cache
      force_checkout: true
      only_different: true

# KiCAD Diff Schematic
  - name: 'diff_sch'
    comment: "SCH difference with git HEAD"
    dir: DIFF
    type: diff
    options:
      old: KIBOT_LAST-10
      old_type: git
      new: HEAD
      new_type: git
      cache_dir: .cache
      force_checkout: true
      only_different: true
      pcb: false
