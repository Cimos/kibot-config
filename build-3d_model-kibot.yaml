kibot:
  version: 1

import:
  # Add custom options for each repository
  - file: ../options.yaml

outputs:
  # Generate 3D Models
  - name: 'step_simple'
    comment: 'Generate Simple 3D Step Model'
    type: step
    dir: Model
    options:
      dnf_filter: '_kibom_dnf'
      no_virtual: true
      output: '%f-%r-%i_simple.%x'
      download_lcsc: false

  - name: step_full
    comment: "Generate Full 3D model (STEP)"
    type: export_3d
    dir: Model
    options:
      no_virtual: true
      output: '%f-%r-%i_full.%x'
      cut_vias_in_body: true
      download_lcsc: false
      include_pads: true
      include_silkscreen: true
      include_soldermask: true
      include_zones: true
